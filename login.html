
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6858e8">
  <title>Connexion — Tempo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      color: #24243a;
      background: #f5f5fb;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: white;
      border: 1px solid #e9e8f2;
      border-radius: 20px;
      box-shadow: 0 18px 60px rgba(35, 30, 80, .08);
    }

    .brand {
      margin-bottom: 8px;
      color: #6858e8;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #77768b;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #deddeb;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #6858e8;
      box-shadow: 0 0 0 3px rgba(104, 88, 232, .12);
    }

    .primary, .secondary {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      color: white;
      background: #6858e8;
    }

    .primary:hover {
      background: #5544d0;
    }

    .secondary {
      margin-top: 10px;
      color: #5144bd;
      background: #f0efff;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .config {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #ecebf3;
    }

    .config summary {
      color: #69687d;
      font-size: 13px;
      cursor: pointer;
    }

    .hint {
      margin-top: 12px;
      color: #77768b;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <div class="brand">Tempo.</div>

    <h1>Bienvenue</h1>
    <p class="subtitle">
      Connecte-toi pour retrouver tes tâches, tes projets,
      ton planning et tes notes.
    </p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="toi@exemple.com"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="6"
        placeholder="Ton mot de passe"
        required
      >

      <button class="primary" id="loginBtn" type="submit">
        Se connecter
      </button>

      <button class="secondary" id="signupBtn" type="button">
        Créer mon compte
      </button>

      <button class="secondary" id="resetBtn" type="button">
        Mot de passe oublié ?
      </button>

      <p class="message" id="authMessage" role="status" aria-live="polite"></p>
    </form>

    <details class="config" id="configSection">
      <summary>Configuration Supabase</summary>

      <label for="supabaseUrl">URL du projet</label>
      <input
        id="supabaseUrl"
        type="url"
        placeholder="https://xxxx.supabase.co"
        autocomplete="url"
      >

      <label for="supabaseKey">Clé publique Supabase</label>
      <input
        id="supabaseKey"
        type="password"
        placeholder="Clé publishable ou anon"
        autocomplete="off"
      >

      <button class="secondary" id="saveConfigBtn" type="button">
        Enregistrer la configuration
      </button>

      <p class="hint">
        Utilise uniquement la clé publique publishable ou anon.
        Ne saisis jamais la clé service_role dans le navigateur.
      </p>
    </details>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</body>
</html>
